<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">About Muhammad Mohsin, written as code</title>
  <desc id="desc">A code editor types a JavaScript object describing Muhammad Mohsin: role Full-Stack Software Developer; based in Lahore, Pakistan; mobile: Android, Java, Flutter, Dart; web: React, JavaScript, HTML, CSS; backend: Python, FastAPI, Firebase; design: UI/UX, Material Design; open to work: true. Beside it, a live preview builds a profile card from the same details.</desc>
